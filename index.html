<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTUS - Agenda Depósito</title>
    <style>
        :root {
            --primary-green: #48a999;
            --border-color: #d1e7dd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            color: #333;
        }

        .header {
            margin-bottom: 20px;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary-green);
            letter-spacing: 2px;
            line-height: 1;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-top: 4px;
        }

        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background-color: var(--primary-green);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        th:first-child {
            width: 100px;
        }

        td {
            border: 1px solid var(--border-color);
            padding: 8px;
            vertical-align: top;
            height: 60px;
            background-color: #fff;
            font-size: 11px;
        }

        td.time-col {
            font-weight: bold;
            color: #333;
            background-color: #f8f9fa !important;
            text-align: center;
            vertical-align: middle;
        }

        .event-card {
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .event-title {
            font-weight: 600;
            color: #111;
            text-transform: uppercase;
        }

        .event-sub {
            color: #555;
            font-size: 10px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ATTUS</div>
        <div class="subtitle">AGENDA DEPÓSITO</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr id="table-header">
                    <th>HoraAgenda</th>
                    <th>Cargando...</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        async function cargarAgenda() {
            try {
                const response = await fetch('agenda.csv?v=' + new Date().getTime());
                const csvText = await response.text();
                
                const lineas = csvText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lineas.length <= 1) return;

                // Normalizar cabeceras a minúsculas
                const headers = lineas[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
                
                const registros = lineas.slice(1).map(linea => {
                    const valores = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
                    let obj = {};
                    headers.forEach((h, idx) => { obj[h] = valores[idx] || ''; });
                    return obj;
                });

                // Función auxiliar para leer campos sin importar variaciones de nombre de columna
                const getCampo = (item, ...claves) => {
                    for (let c of claves) {
                        if (item[c] !== undefined && item[c] !== '') return item[c];
                    }
                    return '';
                };

                // Identificar IDs finalizados
                const idsFinalizados = new Set(
                    registros
                        .filter(r => {
                            const estado = getCampo(r, 'estado', 'estado agenda', 'estadoagenda').toLowerCase();
                            return estado.includes('finalizad');
                        })
                        .map(r => getCampo(r, 'id', 'id_agenda', 'idagenda', 'codigo'))
                        .filter(Boolean)
                );

                // Filtrar solo registros de IDs vigentes
                const registrosVigentes = registros.filter(r => {
                    const id = getCampo(r, 'id', 'id_agenda', 'idagenda', 'codigo');
                    if (id && idsFinalizados.has(id)) return false;
                    return true;
                });

                renderizarMatriz(registrosVigentes, getCampo);
            } catch (err) {
                console.error("Error al cargar datos:", err);
            }
        }

        function renderizarMatriz(datos, getCampo) {
            // Mapear campos estándar
            const procesados = datos.map(d => ({
                fecha: getCampo(d, 'fecha', 'fechaagenda', 'fecha agenda'),
                hora: getCampo(d, 'hora', 'horaagenda', 'hora agenda'),
                destino: getCampo(d, 'destino', 'ubicacion', 'direccion', 'descripcion'),
                fin: getCampo(d, 'fin', 'finalizacion', 'fin aprox', 'finalizacion aprox')
            })).filter(d => d.fecha && d.hora);

            const fechas = [...new Set(procesados.map(d => d.fecha))].sort();
            const horas = [...new Set(procesados.map(d => d.hora))].sort();

            const headerTr = document.getElementById('table-header');
            if (fechas.length === 0) {
                headerTr.innerHTML = '<th>HoraAgenda</th><th>Sin registros vigentes</th>';
                return;
            }

            headerTr.innerHTML = '<th>HoraAgenda</th>' + fechas.map(f => `<th>${f}</th>`).join('');

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            horas.forEach(hora => {
                let tr = document.createElement('tr');
                let htmlHora = `<td class="time-col">${hora}</td>`;

                let htmlCeldas = fechas.map(fecha => {
                    const eventosEnCelda = procesados.filter(d => d.fecha === fecha && d.hora === hora);

                    let contenido = eventosEnCelda.map(e => `
                        <div class="event-card">
                            <div class="event-title">${e.destino || 'SIN ESPECIFICAR'}</div>
                            ${e.fin ? `<div class="event-sub">Finalización aprox: ${e.fin}</div>` : ''}
                        </div>
                    `).join('');

                    return `<td>${contenido}</td>`;
                }).join('');

                tr.innerHTML = htmlHora + htmlCeldas;
                tbody.appendChild(tr);
            });
        }

        window.onload = cargarAgenda;
    </script>
</body>
</html>
