<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTUS - Agenda Depósito</title>
    <style>
        :root {
            --primary-green: #48a999;
            --border-color: #d1e7dd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            color: #333;
        }

        .header {
            margin-bottom: 20px;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary-green);
            letter-spacing: 2px;
            line-height: 1;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-top: 4px;
        }

        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background-color: var(--primary-green);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        th:first-child {
            width: 90px;
        }

        td {
            border: 1px solid var(--border-color);
            padding: 8px;
            vertical-align: top;
            height: 60px;
            background-color: #fff;
            font-size: 11px;
        }

        td.time-col {
            font-weight: bold;
            color: #333;
            background-color: #f8f9fa !important;
            text-align: center;
            vertical-align: middle;
        }

        .event-card {
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .event-title {
            font-weight: 600;
            color: #111;
            text-transform: uppercase;
        }

        .event-sub {
            color: #555;
            font-size: 10px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ALTUS</div>
        <div class="subtitle">AGENDA DEPÓSITO</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr id="table-header">
                    <th>HoraAgenda</th>
                    <th>Cargando...</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        async function cargarAgenda() {
            try {
                const response = await fetch('agenda.csv?v=' + new Date().getTime());
                const csvText = await response.text();
                
                const lineas = csvText.split('\n').filter(l => l.trim() !== '');
                if (lineas.length <= 1) return;

                const headers = lineas[0].split(',').map(h => h.trim().toLowerCase());
                
                const registros = lineas.slice(1).map(linea => {
                    const valores = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
                    let obj = {};
                    headers.forEach((h, idx) => { obj[h] = valores[idx] || ''; });
                    return obj;
                });

                // Filtrar solo VIGENTES (excluir IDs que contengan cualquier estado "Finalizado")
                const idsFinalizados = new Set(
                    registros
                        .filter(r => r.estado && r.estado.toLowerCase().includes('finalizad'))
                        .map(r => r.id)
                );

                const registrosVigentes = registros.filter(r => !idsFinalizados.has(r.id));

                renderizarMatriz(registrosVigentes);
            } catch (err) {
                console.error("Error al cargar datos:", err);
            }
        }

        function renderizarMatriz(datos) {
            const fechas = [...new Set(datos.map(d => d.fecha))].filter(Boolean);
            const horas = [...new Set(datos.map(d => d.hora))].filter(Boolean).sort();

            const headerTr = document.getElementById('table-header');
            headerTr.innerHTML = '<th>HoraAgenda</th>' + fechas.map(f => `<th>${f}</th>`).join('');

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            horas.forEach(hora => {
                let tr = document.createElement('tr');
                let htmlHora = `<td class="time-col">${hora}</td>`;

                let htmlCeldas = fechas.map(fecha => {
                    const eventosEnCelda = datos.filter(d => d.fecha === fecha && d.hora === hora);

                    let contenido = eventosEnCelda.map(e => {
                        const textoDestino = e.destino || e.ubicacion || e.descripcion || 'Sin especificar';
                        const finAprox = e.fin || e.finalizacion || '';

                        return `
                            <div class="event-card">
                                <div class="event-title">${textoDestino}</div>
                                ${finAprox ? `<div class="event-sub">Finalización aprox: ${finAprox}</div>` : ''}
                            </div>
                        `;
                    }).join('');

                    return `<td>${contenido}</td>`;
                }).join('');

                tr.innerHTML = htmlHora + htmlCeldas;
                tbody.appendChild(tr);
            });
        }

        window.onload = cargarAgenda;
    </script>
</body>
</html>
