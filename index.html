<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATTUS - Agenda Depósito</title>

    <style>
        :root {
            --primary-green: #48a999;
            --border-color: #d1e7dd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 25px;
            background: white;
            color: #333;
        }

        .header {
            margin-bottom: 20px;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary-green);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: var(--primary-green);
            color: white;
            padding: 11px;
            text-align: center;
            font-size: 13px;
        }

        td {
            border: 1px solid var(--border-color);
            padding: 8px;
            vertical-align: top;
            min-height: 65px;
            font-size: 11px;
        }

        .time-col {
            width: 80px;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            background: #f8f9fa;
        }

        .event-card {
            background: #f2faf8;
            border-left: 4px solid var(--primary-green);
            border-radius: 3px;
            padding: 7px;
            margin-bottom: 5px;
        }

        .event-title {
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .event-address {
            color: #555;
            margin-bottom: 4px;
        }

        .event-finish {
            font-weight: 600;
        }

        .error {
            padding: 20px;
            text-align: center;
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">ATTUS</div>
    <div class="subtitle">AGENDA DEPÓSITO</div>
</div>

<div class="table-container">

    <table>

        <thead>
            <tr id="table-header">
                <th>Hora</th>
            </tr>
        </thead>

        <tbody id="table-body"></tbody>

    </table>

</div>

<script>

async function cargarAgenda() {

    try {

        const response = await fetch(
            "agenda.csv?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "No se pudo encontrar agenda.csv"
            );
        }

        const texto = await response.text();

        console.log("CSV recibido:", texto.substring(0, 500));

        const registros = leerCSV(texto);

        console.log("Registros:", registros);

        if (registros.length === 0) {
            throw new Error("El CSV está vacío");
        }

        // SOLO Es_Ultimo_Vigente = SI
        const vigentes = registros.filter(r => {

            const valor = obtener(
                r,
                "es_ultimo_vigente",
                "esultimovigente"
            );

            return normalizar(valor) === "SI";

        });

        console.log("Registros vigentes:", vigentes);

        renderizar(vigentes);

    }
    catch (error) {

        console.error(error);

        document.getElementById("table-body").innerHTML = `
            <tr>
                <td colspan="20" class="error">
                    Error al cargar la agenda.<br>
                    <small>${error.message}</small>
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   LEER CSV
   Detecta automáticamente ; o ,
========================================================= */

function leerCSV(texto) {

    texto = texto.replace(/^\uFEFF/, "");

    const lineas = texto
        .split(/\r?\n/)
        .filter(l => l.trim() !== "");

    if (lineas.length < 2) {
        return [];
    }

    // Detectar separador
    const separador =
        lineas[0].includes(";")
            ? ";"
            : ",";

    const headers = parsearLinea(
        lineas[0],
        separador
    ).map(h =>
        normalizarNombre(h)
    );

    const registros = [];

    for (let i = 1; i < lineas.length; i++) {

        const valores = parsearLinea(
            lineas[i],
            separador
        );

        const registro = {};

        headers.forEach((header, index) => {

            registro[header] =
                valores[index]
                    ? valores[index].trim()
                    : "";

        });

        registros.push(registro);

    }

    return registros;
}


/* =========================================================
   PARSER CSV
========================================================= */

function parsearLinea(linea, separador) {

    const resultado = [];

    let campo = "";
    let comillas = false;

    for (let i = 0; i < linea.length; i++) {

        const c = linea[i];

        if (c === '"') {

            comillas = !comillas;

        }
        else if (c === separador && !comillas) {

            resultado.push(
                campo.replace(/^"|"$/g, "")
            );

            campo = "";

        }
        else {

            campo += c;

        }

    }

    resultado.push(
        campo.replace(/^"|"$/g, "")
    );

    return resultado;
}


/* =========================================================
   NORMALIZAR NOMBRES DE COLUMNAS
========================================================= */

function normalizarNombre(texto) {

    return String(texto || "")
        .replace(/^\uFEFF/, "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");

}


/* =========================================================
   NORMALIZAR VALORES
========================================================= */

function normalizar(valor) {

    return String(valor || "")
        .trim()
        .toUpperCase();

}


/* =========================================================
   OBTENER CAMPO
========================================================= */

function obtener(registro, ...nombres) {

    for (const nombre of nombres) {

        const clave = normalizarNombre(nombre);

        if (
            registro[clave] !== undefined &&
            registro[clave] !== ""
        ) {

            return registro[clave];

        }

    }

    return "";
}


/* =========================================================
   FECHA
========================================================= */

function convertirFecha(fecha) {

    if (!fecha) return "";

    // DD/MM/YYYY
    let partes = fecha.split("/");

    if (partes.length === 3) {

        return new Date(
            partes[2],
            partes[1] - 1,
            partes[0]
        );

    }

    // YYYY-MM-DD
    partes = fecha.split("-");

    if (partes.length === 3) {

        return new Date(
            partes[0],
            partes[1] - 1,
            partes[2]
        );

    }

    return new Date(fecha);
}


/* =========================================================
   MOSTRAR FECHA
========================================================= */

function mostrarFecha(fecha) {

    const d = convertirFecha(fecha);

    if (isNaN(d)) {
        return fecha;
    }

    return String(d.getDate()).padStart(2, "0")
        + "/"
        + String(d.getMonth() + 1).padStart(2, "0");

}


/* =========================================================
   ORDENAR HORA
========================================================= */

function horaNumero(hora) {

    if (!hora) return 9999;

    const partes = hora.substring(0,5).split(":");

    return (
        Number(partes[0] || 0) * 60 +
        Number(partes[1] || 0)
    );

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(datos) {

    const header =
        document.getElementById("table-header");

    const body =
        document.getElementById("table-body");

    header.innerHTML = "";
    body.innerHTML = "";


    if (datos.length === 0) {

        header.innerHTML = `
            <th>Hora</th>
            <th>Sin agenda vigente</th>
        `;

        body.innerHTML = `
            <tr>
                <td colspan="2">
                    No hay registros con
                    Es_Ultimo_Vigente = SI
                </td>
            </tr>
        `;

        return;

    }


    // ---------------------------------------------------------
    // FECHAS
    // ---------------------------------------------------------

    const fechas = [
        ...new Set(
            datos
                .map(d =>
                    obtener(
                        d,
                        "fecha",
                        "fecha_agenda"
                    )
                )
                .filter(Boolean)
        )
    ];


    fechas.sort(
        (a,b) =>
            convertirFecha(a) -
            convertirFecha(b)
    );


    // ---------------------------------------------------------
    // HORAS
    // ---------------------------------------------------------

    const horas = [
        ...new Set(
            datos
                .map(d =>
                    obtener(
                        d,
                        "hora",
                        "hora_agenda"
                    )
                )
                .filter(Boolean)
        )
    ];


    horas.sort(
        (a,b) =>
            horaNumero(a) -
            horaNumero(b)
    );


    // ---------------------------------------------------------
    // ENCABEZADO
    // ---------------------------------------------------------

    header.innerHTML =
        `<th>Hora</th>` +
        fechas.map(f =>
            `<th>${mostrarFecha(f)}</th>`
        ).join("");


    // ---------------------------------------------------------
    // FILAS
    // ---------------------------------------------------------

    horas.forEach(hora => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `
            <td class="time-col">
                ${hora.substring(0,5)}
            </td>
        `;


        fechas.forEach(fecha => {

            const td =
                document.createElement("td");


            const eventos =
                datos.filter(d => {

                    return (
                        obtener(d,"fecha","fecha_agenda")
                            === fecha
                        &&
                        obtener(d,"hora","hora_agenda")
                            === hora
                    );

                });


            eventos.forEach(evento => {

                const destino =
                    obtener(
                        evento,
                        "destino",
                        "destino1"
                    );

                const direccion =
                    obtener(
                        evento,
                        "direccion",
                        "direccion1"
                    );

                const destino2 =
                    obtener(
                        evento,
                        "destino2"
                    );

                const direccion2 =
                    obtener(
                        evento,
                        "direccion2"
                    );

                const finalizacion =
                    obtener(
                        evento,
                        "finalizacion_estimada",
                        "finalizacion",
                        "fin"
                    );


                let destinoTexto =
                    destino || "SIN DESTINO";


                if (destino2) {
                    destinoTexto +=
                        " → " + destino2;
                }


                let direccionTexto =
                    direccion || "SIN DIRECCIÓN";


                if (direccion2) {
                    direccionTexto +=
                        " → " + direccion2;
                }


                const card =
                    document.createElement("div");

                card.className =
                    "event-card";


                card.innerHTML = `

                    <div class="event-title">
                        ${destinoTexto}
                    </div>

                    <div class="event-address">
                        ${direccionTexto}
                    </div>

                    ${
                        finalizacion
                        ?
                        `
                        <div class="event-finish">
                            Finalización estimada:
                            ${finalizacion.substring(0,5)}
                        </div>
                        `
                        :
                        ""
                    }

                `;


                td.appendChild(card);

            });


            tr.appendChild(td);

        });


        body.appendChild(tr);

    });

}


// =========================================================
// INICIAR
// =========================================================

window.addEventListener(
    "load",
    cargarAgenda
);

</script>

</body>
</html>
